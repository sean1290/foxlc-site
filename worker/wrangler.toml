# 폭스러닝센터 사이트 API (채용공고 · 관리자 로그인)
# 배포: npx wrangler deploy   (README 의 'API 서버' 참고)
name = "foxlc-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# 이 주소에서 온 요청만 받는다 (쉼표로 구분)
ALLOWED_ORIGINS = "https://sean1290.github.io,http://localhost:8081"

[[d1_databases]]
binding = "DB"
database_name = "foxlc"
database_id = "3874da5f-59b9-4b45-8e05-68549fef6a33"
migrations_dir = "migrations"

# 비밀값(코드에 넣지 않음): npx wrangler secret put SESSION_SECRET
