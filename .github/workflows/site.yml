# 폭스러닝센터 사이트: 매일 피드를 가져오고, 빌드해서 GitHub Pages에 올린다.
# 이 파일은 foxlc-site 폴더가 저장소의 루트일 때 동작한다 (README 참고).
name: Sync feeds and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 11 * * *"   # 매일 20:40 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 피드 하나가 실패해도 사이트는 기존 데이터로 계속 배포하고, 마지막에 실패로 표시한다.
      - name: Sync 폭스뉴스
        id: news
        continue-on-error: true
        run: node scripts/sync-news.mjs
      # 폭스뉴스 본문·사진(학부모 전용)은 이 공개 저장소가 아니라 API 서버가 직접 가져와 보관한다.
      - name: Sync 폭스뉴스 본문 (학부모 전용 API)
        continue-on-error: true
        run: |
          API=$(node -p "require('./site.config.json').apiBase || ''")
          [ -n "$API" ] || exit 0
          for page in 1 2; do
            for i in 1 2 3 4 5; do
              r=$(curl -s -m 60 -X POST "$API/api/news/sync?page=$page"); echo "$r"
              echo "$r" | grep -q '"more":true' || break
            done
          done
      - name: Sync 유튜브 영상
        id: videos
        continue-on-error: true
        run: node scripts/sync-videos.mjs

      - name: Sync 네이버 소식
        id: naver
        continue-on-error: true
        run: |
          node scripts/sync-naver.mjs
          python3 -m pip install --quiet pillow
          python3 scripts/shrink-images.py static/naver-img

      - name: Sync SEL 칼럼
        id: columns
        continue-on-error: true
        run: node scripts/sync-columns.mjs

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/news-img static/naver-img
          git diff --cached --quiet || { git commit -m "Sync feeds $(date -u +%F)"; git push; }

      - name: Build
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for artifact (GitHub 반영 지연 대비)
        run: sleep 30
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: sleep 30 && node scripts/indexnow.mjs

      # 조용히 실패하지 않도록: 이슈를 만들고(이메일 알림이 온다) 실행 자체도 실패로 끝낸다.
      - name: Report sync failure
        if: steps.news.outcome == 'failure' || steps.videos.outcome == 'failure' || steps.naver.outcome == 'failure' || steps.columns.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="폭스뉴스: ${{ steps.news.outcome }} / 유튜브: ${{ steps.videos.outcome }} / 네이버 소식: ${{ steps.naver.outcome }} / SEL 칼럼: ${{ steps.columns.outcome }}
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "피드 동기화 실패 in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "피드 동기화 실패" --body "$body"; fi
          exit 1
